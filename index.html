<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Weather App</title>
  <link rel="stylesheet" href="/assect/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">

    <!-- Current Weather -->
    <section class="current-weather">
      <h1 id="location">Colombo, Western, Sri Lanka</h1>
      <p id="local-time">Local Time: 12:30 PM</p>
      <div class="weather-info">
        <img src="https://via.placeholder.com/80" alt="Weather Icon" id="weather-icon">
        <div>
          <h2 id="condition">Sunny</h2>
          <p id="temp">30°C / 86°F</p>
          <p id="feels-like">Feels like: 33°C</p>
        </div>
      </div>
      <div class="details-grid">
        <div id="wind-speed">💨 Wind: 20 KPH / 12 MPH</div>
        <div id="humidity">💧 Humidity: 60%</div>
        <div id="cloud">☁️ Cloud: 10%</div>
        <div id="uv">🌞 UV Index: 5</div>
        <div id="pressure">🌡️ Pressure: 1010 hPa</div>
        <div id="visibility">🔭 Visibility: 10 KM</div>
      </div>
    </section>



  </div>
</body>
</html>
